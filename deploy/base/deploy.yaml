apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: simple-go
  name: simple-go
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=false
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-go
  strategy: {}
  template:
    metadata:
      labels:
        app: simple-go
    spec:
      containers:
      - image: quay.io/christianh814/simple-go:latest
        name: simple-go
